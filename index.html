<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>woofr.chat</title>
<script src="https://cdn.jsdelivr.net/npm/strophe.js@1.6.2/dist/strophe.umd.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #008080;
    font-family: "Tahoma", "MS Sans Serif", Arial, sans-serif;
    font-size: 11px;
    color: #000;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Window chrome (full-screen maximised) ── */
  .window {
    background: #c0c0c0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .title-bar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    flex-shrink: 0;
  }

  .title-bar-buttons { display: flex; gap: 2px; }

  .title-btn {
    width: 16px; height: 14px;
    border: 1px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #c0c0c0;
    color: #000;
    font-size: 9px;
    font-weight: bold;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .title-btn:active { border-color: #808080 #dfdfdf #dfdfdf #808080; }

  .alpha-badge {
    background: #ff6600;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    padding: 1px 4px;
    border: 1px solid #803300;
    border-radius: 2px;
    letter-spacing: 0.5px;
    margin-left: 6px;
    vertical-align: middle;
    white-space: nowrap;
  }

  /* ── Menu bar ── */
  .menubar {
    background: #c0c0c0;
    border-bottom: 1px solid #808080;
    padding: 1px 4px;
    font-size: 11px;
    display: flex; gap: 8px;
    flex-shrink: 0;
  }
  .menubar span { padding: 1px 4px; cursor: default; }
  .menubar span:hover { background: #000080; color: #fff; }
  .menubar span u { text-decoration: underline; }

  /* ── App body (fills remaining height) ── */
  .app-body {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Status bar ── */
  #status-bar {
    background: #c0c0c0;
    border-top: 1px solid #808080;
    box-shadow: 0 1px 0 #dfdfdf inset;
    padding: 1px 6px;
    font-size: 10px;
    color: #444;
    min-height: 16px;
    flex-shrink: 0;
  }
  #status-bar.error { color: #cc0000; font-weight: bold; }
  #status-bar.ok    { color: #006600; font-weight: bold; }

  /* ── Login panel (centered dialog) ── */
  #login-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #c0c0c0;
  }

  #login-card {
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .login-logo {
    text-align: center;
    padding: 10px 0;
    font-size: 22px;
    font-weight: bold;
    color: #000080;
    text-shadow: 1px 1px 0 #fff;
    letter-spacing: -1px;
  }
  .login-logo span { color: #ff6600; }

  .form-row { display: flex; align-items: center; gap: 6px; }
  .form-row label { width: 90px; text-align: right; font-size: 11px; }

  input[type=text], input[type=password] {
    flex: 1;
    border: 1px solid;
    border-color: #808080 #dfdfdf #dfdfdf #808080;
    background: #fff;
    padding: 2px 3px;
    font-size: 11px;
    font-family: inherit;
    outline: none;
  }
  input[type=text]:focus, input[type=password]:focus {
    border-color: #000080 #dfdfdf #dfdfdf #000080;
  }

  .btn {
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #c0c0c0;
    padding: 3px 12px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 1px 1px 0 #fff inset;
  }
  .btn:active {
    border-color: #808080 #dfdfdf #dfdfdf #808080;
    box-shadow: none;
    padding: 4px 11px 2px 13px;
  }
  .btn:focus { outline: 1px dotted #000; outline-offset: -4px; }
  .btn.primary { font-weight: bold; }

  /* ── App layout (buddy sidebar + chat) ── */
  #app-layout {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Buddy list sidebar ── */
  #buddy-panel {
    width: 220px;
    min-width: 180px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 2px solid #808080;
    box-shadow: -1px 0 0 #dfdfdf inset;
    background: #c0c0c0;
  }

  .buddy-header {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: bold;
    display: flex; justify-content: space-between;
    flex-shrink: 0;
  }

  #my-status {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px;
    background: #d4d0c8;
    border-bottom: 1px solid #808080;
    font-size: 11px;
    flex-shrink: 0;
  }

  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid #666;
    background: #33cc33;
    flex-shrink: 0;
  }
  .status-dot.away    { background: #ffcc00; }
  .status-dot.offline { background: #aaa; }

  #buddy-list {
    list-style: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #808080;
    margin: 2px 4px;
  }

  #buddy-list li {
    padding: 2px 6px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1px dotted #e0e0e0;
    font-size: 11px;
  }
  #buddy-list li:hover { background: #000080; color: #fff; }
  #buddy-list li:hover .status-dot { border-color: #fff; }

  #buddy-list .group-header {
    background: #d4d0c8;
    font-weight: bold;
    font-size: 10px;
    padding: 1px 4px;
    cursor: default;
    color: #000;
    border-bottom: 1px solid #808080;
  }
  #buddy-list .group-header:hover { background: #d4d0c8; color: #000; }

  .add-buddy-row {
    display: flex; gap: 4px; padding: 4px;
    flex-shrink: 0;
  }
  .add-buddy-row input { flex: 1; }

  .separator {
    border: none;
    border-top: 1px solid #808080;
    border-bottom: 1px solid #fff;
    margin: 4px 0;
    flex-shrink: 0;
  }

  /* ── Chat area (fills remaining width) ── */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  #chat-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-style: italic;
    background: #fff;
  }

  .chat-tabs {
    display: flex;
    border-bottom: 2px solid #808080;
    background: #c0c0c0;
    gap: 2px;
    padding: 2px 2px 0;
    flex-shrink: 0;
  }

  .chat-tab {
    border: 1px solid;
    border-color: #dfdfdf #808080 #c0c0c0 #dfdfdf;
    background: #c0c0c0;
    padding: 2px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    color: #555;
  }
  .chat-tab.active {
    background: #fff;
    border-bottom-color: #fff;
    color: #000;
    font-weight: bold;
    padding-bottom: 3px;
    margin-bottom: -2px;
  }
  .chat-tab .close-tab { margin-left: 6px; color: #888; font-size: 9px; }
  .chat-tab:hover .close-tab { color: #cc0000; }

  #chat-windows {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .chat-window { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; background: #fff; }
  .chat-window.active { display: flex; }

  .chat-log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px;
    font-size: 11px;
    border-bottom: 1px solid #c0c0c0;
    line-height: 1.5;
  }

  .msg-them .nick { color: #cc0000; font-weight: bold; }
  .msg-me .nick   { color: #000080; font-weight: bold; }
  .msg-system     { color: #888; font-style: italic; font-size: 10px; }
  .msg-time       { color: #aaa; font-size: 9px; }

  .chat-input-area {
    display: flex; flex-direction: column; gap: 2px;
    padding: 4px;
    background: #f0f0f0;
    border-top: 1px solid #dfdfdf;
    flex-shrink: 0;
  }

  .chat-toolbar {
    display: flex; gap: 3px; font-size: 10px;
    border-bottom: 1px solid #d0d0d0;
    padding-bottom: 2px;
  }
  .chat-toolbar button {
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    padding: 1px 3px;
    font-family: "Times New Roman", serif;
  }
  .chat-toolbar button:hover { border-color: #808080; background: #c0c0c0; }

  #chat-input-row { display: flex; gap: 4px; }

  textarea.chat-input {
    flex: 1;
    border: 1px solid;
    border-color: #808080 #dfdfdf #dfdfdf #808080;
    font-family: inherit;
    font-size: 11px;
    resize: none;
    padding: 2px;
    height: 44px;
    outline: none;
  }
  textarea.chat-input:focus { border-color: #000080 #dfdfdf #dfdfdf #000080; }

  .send-col { display: flex; flex-direction: column; gap: 2px; }

  /* ── Scrollbar (retro) ── */
  ::-webkit-scrollbar { width: 16px; }
  ::-webkit-scrollbar-track { background: #c0c0c0; }
  ::-webkit-scrollbar-thumb {
    background: #c0c0c0;
    border: 1px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    box-shadow: 1px 1px 0 #fff inset;
  }

  /* ── Groupbox ── */
  .groupbox {
    border: 1px solid #808080;
    box-shadow: 1px 1px 0 #fff;
    padding: 6px;
    margin: 4px 0;
    position: relative;
  }
  .groupbox legend { font-size: 10px; padding: 0 3px; color: #444; }

  /* ── XEP-0224 Nudge ── */
  @keyframes nudge {
    0%   { transform: translateX(0); }
    10%  { transform: translateX(-8px) rotate(-1deg); }
    20%  { transform: translateX(8px)  rotate(1deg); }
    30%  { transform: translateX(-8px) rotate(-1deg); }
    40%  { transform: translateX(8px)  rotate(1deg); }
    50%  { transform: translateX(-6px); }
    60%  { transform: translateX(6px); }
    70%  { transform: translateX(-4px); }
    80%  { transform: translateX(4px); }
    90%  { transform: translateX(-2px); }
    100% { transform: translateX(0); }
  }
  .nudging { animation: nudge 0.6s ease-in-out; }

  .nudge-btn {
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    padding: 1px 5px;
    font-size: 11px;
    font-family: inherit;
    color: #800000;
    font-weight: bold;
  }
  .nudge-btn:hover  { border-color: #808080; background: #c0c0c0; }
  .nudge-btn:active { border-color: #808080 #dfdfdf #dfdfdf #808080; }

  .msg-nudge-error {
    background: #fff0f0;
    border: 2px solid #cc0000;
    color: #cc0000;
    font-weight: bold;
    font-size: 11px;
    padding: 3px 6px;
    margin: 3px 0;
    text-align: center;
  }

  .msg-nudge {
    color: #800000;
    font-weight: bold;
    font-style: italic;
    font-size: 10px;
    text-align: center;
    padding: 2px 0;
    border-top: 1px dashed #ffaaaa;
    border-bottom: 1px dashed #ffaaaa;
    margin: 2px 0;
  }

  /* ── Priority Message ── */
  .msg-priority {
    background: #ffffcc;
    border: 2px solid #cc0000;
    padding: 4px 6px;
    margin: 4px 0;
    font-size: 11px;
  }
  .msg-priority .priority-header {
    color: #cc0000;
    font-weight: bold;
    font-size: 10px;
    margin-bottom: 3px;
    display: flex; align-items: center; gap: 6px;
  }
  .msg-priority .priority-header span { flex: 1; }
  .msg-priority .priority-body { color: #000; font-weight: bold; }
  .msg-priority .priority-ack { margin-top: 4px; display: flex; justify-content: flex-end; }

  .priority-ack-btn {
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #c0c0c0;
    padding: 1px 8px;
    font-size: 10px;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
    color: #cc0000;
  }
  .priority-ack-btn:active   { border-color: #808080 #dfdfdf #dfdfdf #808080; }
  .priority-ack-btn:disabled { color: #888; cursor: default; }

  .priority-send-btn {
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #ffeeee;
    padding: 3px 8px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
    color: #cc0000;
  }
  .priority-send-btn:active { border-color: #808080 #dfdfdf #dfdfdf #808080; padding: 4px 7px 2px 9px; }
</style>
</head>
<body>

<div class="window" id="main-window">

  <div class="title-bar">
    <span>&#128172; woofr.chat <span class="alpha-badge" title="This is an early alpha build and may be unstable">ALPHA</span></span>
    <div class="title-bar-buttons">
      <button class="title-btn">_</button>
      <button class="title-btn">&#9633;</button>
      <button class="title-btn" style="font-size:11px;">&#x2715;</button>
    </div>
  </div>

  <div class="menubar">
    <span><u>F</u>ile</span>
    <span><u>P</u>eople</span>
    <span><u>A</u>ctions</span>
    <span><u>H</u>elp</span>
  </div>

  <div class="app-body">

    <!-- LOGIN -->
    <div id="login-panel">
      <div id="login-card">
        <div class="login-logo">woofr<span>.chat</span> <span class="alpha-badge" title="This is an early alpha build and may be unstable">ALPHA</span></div>

        <fieldset class="groupbox">
          <legend>Sign In</legend>
          <div style="display:flex;flex-direction:column;gap:5px;margin-top:4px;">
            <div class="form-row">
              <label for="inp-jid">Screen Name:</label>
              <input type="text" id="inp-jid" placeholder="user@woofr.chat" />
            </div>
            <div class="form-row">
              <label for="inp-pass">Password:</label>
              <input type="password" id="inp-pass" placeholder="••••••••" />
            </div>
            <input type="hidden" id="inp-bosh" value="https://woofr.chat:5443/bosh" />
          </div>
        </fieldset>

        <div style="display:flex;justify-content:flex-end;gap:6px;padding:0 2px;">
          <button class="btn primary" id="btn-login" onclick="doLogin()">Sign In</button>
          <button class="btn" onclick="doCancel()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- APP LAYOUT (shown after login) -->
    <div id="app-layout" style="display:none">

      <!-- LEFT: buddy list sidebar -->
      <div id="buddy-panel">
        <div id="my-status">
          <div class="status-dot" id="my-dot"></div>
          <span id="my-jid-display">you</span>
          <span style="margin-left:auto;color:#666;">[online]</span>
        </div>

        <div class="buddy-header">
          <span>Buddy List</span>
          <span id="buddy-count">0 online</span>
        </div>

        <ul id="buddy-list">
          <li class="group-header">▼ Buddies</li>
        </ul>

        <div class="add-buddy-row">
          <input type="text" id="inp-add-buddy" placeholder="Add buddy (jid@server)" />
          <button class="btn" onclick="addBuddy()">Add</button>
        </div>

        <hr class="separator">

        <div style="display:flex;justify-content:flex-end;gap:4px;padding:4px 4px;">
          <button class="btn" onclick="doSignOut()">Sign Out</button>
        </div>
      </div>

      <!-- RIGHT: chat area -->
      <div id="chat-area">
        <div class="chat-tabs" id="chat-tabs" style="display:none"></div>
        <div id="chat-windows"></div>
        <div id="chat-placeholder">Select a buddy to start chatting</div>
      </div>

    </div><!-- /app-layout -->

  </div><!-- /app-body -->

  <!-- STATUS BAR -->
  <div id="status-bar">Not connected.</div>

</div><!-- /window -->

<script>
// ── State ──────────────────────────────────────────────────────────────────
let conn = null;
let myJid = '';
let buddies = {}; // jid -> { name, show }
let chatWindows = {}; // jid -> { tab: el, win: el }
let activeChat = null;

// ── Helpers ────────────────────────────────────────────────────────────────
function now() {
  const d = new Date();
  return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function bareJid(jid) {
  return jid ? jid.split('/')[0].toLowerCase() : '';
}

function setStatus(msg, type) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = type || '';
}

// ── Login ──────────────────────────────────────────────────────────────────
function doLogin() {
  const jid  = document.getElementById('inp-jid').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const bosh = document.getElementById('inp-bosh').value.trim();

  if (!jid || !pass || !bosh) { setStatus('Please fill in all fields.', 'error'); return; }

  setStatus('Connecting…');
  document.getElementById('btn-login').disabled = true;

  conn = new Strophe.Connection(bosh);
  // Strophe's SCRAM-SHA-512 implementation is broken in this build;
  // strip everything except PLAIN so auth succeeds.
  Object.keys(conn.mechanisms).forEach(k => {
    if (k !== 'PLAIN') delete conn.mechanisms[k];
  });
  conn.connect(jid, pass, onConnectStatus);
}

function doCancel() {
  document.getElementById('inp-pass').value = '';
  setStatus('Not connected.');
  if (conn) { conn.disconnect(); conn = null; }
}

function doSignOut() {
  stopAlertLoop();
  if (conn) { conn.disconnect(); conn = null; }
  showLogin();
}

function onConnectStatus(status) {
  const S = Strophe.Status;
  const names = {
    [S.CONNECTING]:    ['Connecting…',           ''],
    [S.AUTHENTICATING]:['Authenticating…',        ''],
    [S.AUTHFAIL]:      ['Authentication failed.', 'error'],
    [S.CONNFAIL]:      ['Connection failed.',     'error'],
    [S.DISCONNECTING]: ['Disconnecting…',         ''],
    [S.DISCONNECTED]:  ['Disconnected.',          ''],
    [S.CONNECTED]:     ['Connected!',             'ok'],
    [S.ERROR]:         ['An error occurred.',     'error'],
  };
  const [msg, cls] = names[status] || ['Unknown status.', ''];
  setStatus(msg, cls);

  if (status === S.CONNECTED) {
    onConnected();
  } else if ([S.DISCONNECTED, S.AUTHFAIL, S.CONNFAIL, S.ERROR].includes(status)) {
    document.getElementById('btn-login').disabled = false;
  }
}

function requestNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function notify(title, body, { persist = false } = {}) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const n = new Notification(title, { body, silent: true, requireInteraction: persist });
  if (!persist) setTimeout(() => n.close(), 6000);
}

function onConnected() {
  myJid = bareJid(conn.jid);
  document.getElementById('my-jid-display').textContent = myJid;
  requestNotifPermission();

  conn.addHandler(onMessage,   null, 'message', 'chat');
  conn.addHandler(onPresence,  null, 'presence');
  conn.addHandler(onAttention, 'urn:xmpp:attention:0', 'message');

  conn.send($pres().tree());
  conn.sendIQ(
    $iq({type: 'get'}).c('query', {xmlns: Strophe.NS.ROSTER}),
    onRoster
  );

  showBuddyList();
}

// ── Roster ─────────────────────────────────────────────────────────────────
function onRoster(iq) {
  iq.querySelectorAll('item').forEach(item => {
    const jid  = item.getAttribute('jid');
    const name = item.getAttribute('name') || jid;
    if (!buddies[bareJid(jid)]) buddies[bareJid(jid)] = { name, show: 'offline' };
  });
  renderBuddyList();
}

function addBuddy() {
  const jid = document.getElementById('inp-add-buddy').value.trim();
  if (!jid || !conn) return;
  const bare = bareJid(jid);
  buddies[bare] = buddies[bare] || { name: bare, show: 'offline' };
  conn.send($pres({to: jid, type: 'subscribe'}));
  document.getElementById('inp-add-buddy').value = '';
  renderBuddyList();
}

// ── Presence ───────────────────────────────────────────────────────────────
function onPresence(pres) {
  const from = bareJid(pres.getAttribute('from'));
  const type  = pres.getAttribute('type') || 'available';
  const showEl = pres.querySelector('show');
  const show  = showEl ? showEl.textContent : (type === 'available' ? 'online' : 'offline');

  if (from === myJid) return true;

  if (!buddies[from]) buddies[from] = { name: from, show: 'offline' };
  buddies[from].show = (type === 'unavailable') ? 'offline' : show;

  renderBuddyList();
  return true;
}

function renderBuddyList() {
  const ul     = document.getElementById('buddy-list');
  const online  = Object.entries(buddies).filter(([,b]) => b.show !== 'offline');
  const offline = Object.entries(buddies).filter(([,b]) => b.show === 'offline');

  document.getElementById('buddy-count').textContent = online.length + ' online';
  ul.innerHTML = '';

  if (online.length) {
    const gh = document.createElement('li');
    gh.className = 'group-header';
    gh.textContent = '▼ Online (' + online.length + ')';
    ul.appendChild(gh);
    online.forEach(([jid, b]) => ul.appendChild(makeBuddyLi(jid, b)));
  }
  if (offline.length) {
    const gh = document.createElement('li');
    gh.className = 'group-header';
    gh.textContent = '▼ Offline (' + offline.length + ')';
    ul.appendChild(gh);
    offline.forEach(([jid, b]) => ul.appendChild(makeBuddyLi(jid, b)));
  }
}

function makeBuddyLi(jid, b) {
  const li  = document.createElement('li');
  const dot = document.createElement('div');
  dot.className = 'status-dot' + (b.show === 'offline' ? ' offline' : b.show === 'away' ? ' away' : '');
  const name = document.createElement('span');
  name.textContent = b.name || jid;
  li.appendChild(dot);
  li.appendChild(name);
  li.title   = jid;
  li.onclick = () => openChat(jid);
  return li;
}

// ── Messages ───────────────────────────────────────────────────────────────
function hasAttention(msg) {
  return msg.getElementsByTagNameNS('urn:xmpp:attention:0', 'attention').length > 0;
}

function onMessage(msg) {
  const from   = msg.getAttribute('from');
  const bare   = bareJid(from);
  const bodyEl = msg.querySelector('body');
  if (!bodyEl) return true;
  if (hasAttention(msg)) return true; // handled by onAttention
  if (!chatWindows[bare]) createChatWindow(bare);
  appendMsg(bare, bare, bodyEl.textContent, 'them');
  return true;
}

function openChat(jid) {
  if (!chatWindows[jid]) createChatWindow(jid);
  switchTab(jid);
  setTimeout(() => document.querySelector('#chat-win-' + cssId(jid) + ' textarea')?.focus(), 50);
}

function createChatWindow(jid) {
  const id   = cssId(jid);
  const tabs = document.getElementById('chat-tabs');
  const wins = document.getElementById('chat-windows');

  const tab = document.createElement('button');
  tab.className = 'chat-tab';
  tab.id        = 'tab-' + id;
  tab.innerHTML = shortName(jid) + '<span class="close-tab" onclick="closeChat(\'' + jid + '\',event)">✕</span>';
  tab.onclick   = () => switchTab(jid);
  tabs.appendChild(tab);

  const win = document.createElement('div');
  win.className = 'chat-window';
  win.id        = 'chat-win-' + id;
  win.innerHTML = `
    <div class="chat-log" id="log-${id}"></div>
    <div class="chat-input-area">
      <div class="chat-toolbar">
        <button onclick="fmtWrap('${id}','**')"><b>B</b></button>
        <button onclick="fmtWrap('${id}','_')"><i>I</i></button>
        <button style="font-size:13px;" title="Smiley">:)</button>
        <span style="flex:1"></span>
        <button class="nudge-btn" onclick="sendNudge('${jid}')" title="Send Nudge (XEP-0224)">&#128293; Nudge!</button>
        <button class="priority-send-btn" onclick="sendPriorityMsg('${jid}')" title="Priority Message">&#9888; Priority</button>
      </div>
      <div id="chat-input-row">
        <textarea class="chat-input" id="inp-${id}" placeholder="Send a message to ${jid}…"
          onkeydown="chatKey(event,'${jid}')"></textarea>
        <div class="send-col">
          <button class="btn primary" onclick="sendMsg('${jid}')">Send</button>
          <button class="btn" onclick="document.getElementById('inp-${id}').value=''">Clear</button>
        </div>
      </div>
    </div>`;
  wins.appendChild(win);

  chatWindows[jid] = { tab, win };
  appendMsg(jid, null, 'Conversation with ' + jid + ' started at ' + now(), 'system');

  // Show tabs, hide placeholder on first chat
  tabs.style.display = '';
  document.getElementById('chat-placeholder').style.display = 'none';

  switchTab(jid);
}

function switchTab(jid) {
  if (activeChat) {
    chatWindows[activeChat]?.tab.classList.remove('active');
    chatWindows[activeChat]?.win.classList.remove('active');
  }
  activeChat = jid;
  chatWindows[jid].tab.classList.add('active');
  chatWindows[jid].win.classList.add('active');
}

function closeChat(jid, e) {
  e.stopPropagation();
  chatWindows[jid].tab.remove();
  chatWindows[jid].win.remove();
  delete chatWindows[jid];
  if (activeChat === jid) {
    activeChat = null;
    const remaining = Object.keys(chatWindows);
    if (remaining.length) {
      switchTab(remaining[remaining.length - 1]);
    } else {
      document.getElementById('chat-tabs').style.display = 'none';
      document.getElementById('chat-placeholder').style.display = '';
    }
  }
}

function appendMsg(jid, from, text, type) {
  const id  = cssId(jid);
  const log = document.getElementById('log-' + id);
  if (!log) return;
  const row = document.createElement('div');
  if (type === 'system') {
    row.className   = 'msg-system';
    row.textContent = text;
  } else if (type === 'nudge') {
    row.className   = 'msg-nudge';
    row.textContent = text;
  } else if (type === 'nudge-error') {
    row.className   = 'msg-nudge-error';
    row.textContent = text;
  } else {
    row.className = type === 'me' ? 'msg-me' : 'msg-them';
    const nick = type === 'me' ? myJid : (buddies[from]?.name || from);
    row.innerHTML =
      '<span class="msg-time">[' + now() + ']</span> ' +
      '<span class="nick">' + escHtml(nick) + ':</span> ' +
      escHtml(text);
  }
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function sendMsg(jid) {
  const id   = cssId(jid);
  const ta   = document.getElementById('inp-' + id);
  const text = ta.value.trim();
  if (!text || !conn) return;
  conn.send($msg({to: jid, type: 'chat'}).c('body').t(text));
  appendMsg(jid, myJid, text, 'me');
  ta.value = '';
  ta.focus();
}

function chatKey(e, jid) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg(jid);
  }
}

// ── Priority Message ──────────────────────────────────────────────────────
let alertInterval = null;

function sendPriorityMsg(jid) {
  const id   = cssId(jid);
  const ta   = document.getElementById('inp-' + id);
  const text = ta.value.trim();
  if (!text || !conn) return;
  conn.send(
    $msg({to: jid, type: 'chat'})
      .c('body').t(text).up()
      .c('attention', {xmlns: 'urn:xmpp:attention:0'})
  );
  const log = document.getElementById('log-' + id);
  const row = document.createElement('div');
  row.className = 'msg-priority';
  row.innerHTML =
    '<div class="priority-header"><span>&#9888; Priority Message (!):</span>' +
    '<span class="msg-time">[' + now() + '] ' + escHtml(myJid) + '</span></div>' +
    '<div class="priority-body">' + escHtml(text) + '</div>';
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  ta.value = '';
  ta.focus();
}

function appendPriorityMsg(jid, fromName, text) {
  const id  = cssId(jid);
  const log = document.getElementById('log-' + id);
  if (!log) return;
  const msgId = 'pm-' + Date.now();
  const row   = document.createElement('div');
  row.className = 'msg-priority';
  row.id        = msgId;
  row.innerHTML =
    '<div class="priority-header"><span>&#9888; Priority Message (!):</span>' +
    '<span class="msg-time">[' + now() + '] ' + escHtml(fromName) + '</span></div>' +
    '<div class="priority-body">' + escHtml(text) + '</div>' +
    '<div class="priority-ack">' +
    '<button class="priority-ack-btn" onclick="ackPriority(\'' + msgId + '\')">&#10003; Mark as Read</button>' +
    '</div>';
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function ackPriority(msgId) {
  const row = document.getElementById(msgId);
  if (!row) return;
  const btn = row.querySelector('.priority-ack-btn');
  btn.textContent = '✓ Read';
  btn.disabled    = true;
  row.style.borderColor = '#888';
  row.style.background  = '#f5f5f5';
  if (!document.querySelector('.priority-ack-btn:not(:disabled)')) stopAlertLoop();
}

function startAlertLoop() {
  if (alertInterval) return;
  playAlertBeep();
  alertInterval = setInterval(playAlertBeep, 1800);
}

function stopAlertLoop() {
  if (alertInterval) { clearInterval(alertInterval); alertInterval = null; }
}

function playAlertBeep() {
  const ctx     = new (window.AudioContext || window.webkitAudioContext)();
  const pattern = [900, 1400, 900, 1400, 900, 1400];
  pattern.forEach((freq, i) => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
    gain.gain.setValueAtTime(0.7, ctx.currentTime + i * 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.09);
    osc.start(ctx.currentTime + i * 0.1);
    osc.stop(ctx.currentTime  + i * 0.1 + 0.09);
  });
}

// ── XEP-0224 Attention ────────────────────────────────────────────────────
const nudgeTimestamps = {};
const NUDGE_LIMIT     = 2;
const NUDGE_WINDOW_MS = 60_000;

function sendNudge(jid) {
  if (!conn) return;
  const now_ms = Date.now();
  const ts = (nudgeTimestamps[jid] || []).filter(t => now_ms - t < NUDGE_WINDOW_MS);
  if (ts.length >= NUDGE_LIMIT) {
    const wait = Math.ceil((NUDGE_WINDOW_MS - (now_ms - ts[0])) / 1000);
    appendMsg(jid, null, '⚠ Nudge limit reached! Please wait ' + wait + 's before sending another nudge.', 'nudge-error');
    return;
  }
  ts.push(now_ms);
  nudgeTimestamps[jid] = ts;
  conn.send($msg({to: jid, type: 'chat'}).c('attention', {xmlns: 'urn:xmpp:attention:0'}));
  appendMsg(jid, null, '*** You sent a nudge to ' + shortName(jid) + ' ***', 'nudge');
  shakeWindow();
}

function onAttention(msg) {
  const from   = bareJid(msg.getAttribute('from'));
  const bodyEl = msg.querySelector('body');
  if (!chatWindows[from]) createChatWindow(from);
  const name = buddies[from]?.name || from;
  if (bodyEl) {
    appendPriorityMsg(from, name, bodyEl.textContent);
    startAlertLoop();
    notify('⚠ Priority Message from ' + name, bodyEl.textContent, { persist: true });
  } else {
    appendMsg(from, null, '*** ' + name + ' sent you a nudge! ***', 'nudge');
    playNudgeSound();
    notify('🔔 Nudge from ' + name, name + ' is trying to get your attention!');
  }
  shakeWindow();
  return true;
}

function playNudgeSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  [[880, 0.00], [660, 0.12], [440, 0.24]].forEach(([freq, when]) => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + when);
    gain.gain.setValueAtTime(0.4, ctx.currentTime + when);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + 0.3);
    osc.start(ctx.currentTime + when);
    osc.stop(ctx.currentTime + when + 0.3);
  });
}

function shakeWindow() {
  const win = document.getElementById('main-window');
  win.classList.remove('nudging');
  void win.offsetWidth;
  win.classList.add('nudging');
  win.addEventListener('animationend', () => win.classList.remove('nudging'), {once: true});
}

function fmtWrap(id, ch) {
  const ta  = document.getElementById('inp-' + id);
  const s   = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(s, end);
  ta.setRangeText(ch + sel + ch, s, end, 'end');
  ta.focus();
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function showBuddyList() {
  document.getElementById('login-panel').style.display = 'none';
  document.getElementById('app-layout').style.display  = 'flex';
}

function showLogin() {
  document.getElementById('login-panel').style.display = '';
  document.getElementById('app-layout').style.display  = 'none';
  document.getElementById('btn-login').disabled = false;
  // Reset chat area state
  document.getElementById('chat-tabs').innerHTML    = '';
  document.getElementById('chat-tabs').style.display = 'none';
  document.getElementById('chat-windows').innerHTML = '';
  document.getElementById('chat-placeholder').style.display = '';
  buddies = {}; chatWindows = {}; activeChat = null;
  setStatus('Not connected.');
}

function cssId(jid) {
  return jid.replace(/[@.]/g, '_');
}

function shortName(jid) {
  return (buddies[bareJid(jid)]?.name || jid).split('@')[0];
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
