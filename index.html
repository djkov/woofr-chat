<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>woofr.chat</title>
<!-- Vendored (see vendor/), not loaded from a CDN: no third party in the load
     path, and the CSP can stay at script-src 'self'. -->
<script src="vendor/strophe.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; }

  body {
    background: #008080;
    font-family: "Tahoma", "MS Sans Serif", Arial, sans-serif;
    font-size: 11px;
    color: #000;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── Window chrome (full-screen maximised) ── */
  .window {
    background: #c0c0c0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .title-bar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    flex-shrink: 0;
  }

  .title-bar-buttons { display: flex; gap: 2px; }

  .title-btn {
    width: 16px; height: 14px;
    border: 1px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #c0c0c0;
    color: #000;
    font-size: 9px;
    font-weight: bold;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .title-btn:active { border-color: #808080 #dfdfdf #dfdfdf #808080; }

  .alpha-badge {
    background: #ff6600;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    padding: 1px 4px;
    border: 1px solid #803300;
    border-radius: 2px;
    letter-spacing: 0.5px;
    margin-left: 6px;
    vertical-align: middle;
    white-space: nowrap;
  }

  /* ── Menu bar ── */
  .menubar {
    background: #c0c0c0;
    border-bottom: 1px solid #808080;
    padding: 1px 4px;
    font-size: 11px;
    display: flex; gap: 8px;
    flex-shrink: 0;
  }
  .menubar span { padding: 1px 4px; cursor: default; }
  .menubar span:hover { background: #000080; color: #fff; }
  .menubar span u { text-decoration: underline; }

  /* ── App body (fills remaining height) ── */
  .app-body {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Status bar ── */
  #status-bar {
    background: #c0c0c0;
    border-top: 1px solid #808080;
    box-shadow: 0 1px 0 #dfdfdf inset;
    padding: 1px 6px;
    font-size: 10px;
    color: #444;
    min-height: 16px;
    flex-shrink: 0;
  }
  #status-bar.error { color: #cc0000; font-weight: bold; }
  #status-bar.ok    { color: #006600; font-weight: bold; }

  /* ── Login / lock panels (centered dialog) ── */
  #login-panel, #lock-panel {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #c0c0c0;
  }

  #login-card, #lock-card {
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .login-logo {
    text-align: center;
    padding: 10px 0;
    font-size: 22px;
    font-weight: bold;
    color: #000080;
    text-shadow: 1px 1px 0 #fff;
    letter-spacing: -1px;
  }
  .login-logo span { color: #ff6600; }

  .login-warning {
    background: #fff0f0;
    border: 2px solid #cc0000;
    color: #cc0000;
    font-weight: bold;
    padding: 3px 6px;
    text-align: center;
  }

  .lock-error { color: #cc0000; font-weight: bold; min-height: 1.2em; }

  .form-row { display: flex; align-items: center; gap: 6px; }
  .form-row label { width: 90px; text-align: right; font-size: 11px; }

  input[type=text], input[type=password] {
    flex: 1;
    min-width: 0;
    border: 1px solid;
    border-color: #808080 #dfdfdf #dfdfdf #808080;
    background: #fff;
    padding: 2px 3px;
    font-size: 11px;
    font-family: inherit;
    outline: none;
  }
  input[type=text]:focus, input[type=password]:focus {
    border-color: #000080 #dfdfdf #dfdfdf #000080;
  }

  .btn {
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #c0c0c0;
    padding: 3px 12px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 1px 1px 0 #fff inset;
  }
  .btn:active {
    border-color: #808080 #dfdfdf #dfdfdf #808080;
    box-shadow: none;
    padding: 4px 11px 2px 13px;
  }
  .btn:focus { outline: 1px dotted #000; outline-offset: -4px; }
  .btn.primary { font-weight: bold; }

  /* ── App layout (buddy sidebar + chat) ── */
  #app-layout {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Buddy list sidebar ── */
  #buddy-panel {
    width: 220px;
    min-width: 180px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 2px solid #808080;
    box-shadow: -1px 0 0 #dfdfdf inset;
    background: #c0c0c0;
  }

  .buddy-header {
    background: linear-gradient(to right, #000080, #1084d0);
    color: #fff;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: bold;
    display: flex; justify-content: space-between;
    flex-shrink: 0;
  }

  #my-status {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px;
    background: #d4d0c8;
    border-bottom: 1px solid #808080;
    font-size: 11px;
    flex-shrink: 0;
  }

  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid #666;
    background: #33cc33;
    flex-shrink: 0;
  }
  .status-dot.away    { background: #ffcc00; }
  .status-dot.offline { background: #aaa; }

  #buddy-list {
    list-style: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #808080;
    margin: 2px 4px;
  }

  #buddy-list li {
    padding: 2px 6px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1px dotted #e0e0e0;
    font-size: 11px;
  }
  #buddy-list li:hover { background: #000080; color: #fff; }
  #buddy-list li:hover .status-dot { border-color: #fff; }

  #buddy-list .group-header {
    background: #d4d0c8;
    font-weight: bold;
    font-size: 10px;
    padding: 1px 4px;
    cursor: default;
    color: #000;
    border-bottom: 1px solid #808080;
  }
  #buddy-list .group-header:hover { background: #d4d0c8; color: #000; }

  .add-buddy-row {
    display: flex; gap: 4px; padding: 4px;
    flex-shrink: 0;
  }
  .add-buddy-row input { flex: 1; }

  .separator {
    border: none;
    border-top: 1px solid #808080;
    border-bottom: 1px solid #fff;
    margin: 4px 0;
    flex-shrink: 0;
  }

  /* ── Chat area (fills remaining width) ── */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  #chat-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-style: italic;
    background: #fff;
  }

  .chat-tabs {
    display: flex;
    border-bottom: 2px solid #808080;
    background: #c0c0c0;
    gap: 2px;
    padding: 2px 2px 0;
    flex-shrink: 0;
  }

  .chat-tab {
    border: 1px solid;
    border-color: #dfdfdf #808080 #c0c0c0 #dfdfdf;
    background: #c0c0c0;
    padding: 2px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    color: #555;
  }
  .chat-tab.active {
    background: #fff;
    border-bottom-color: #fff;
    color: #000;
    font-weight: bold;
    padding-bottom: 3px;
    margin-bottom: -2px;
  }
  .chat-tab .close-tab { margin-left: 6px; color: #888; font-size: 9px; }
  .chat-tab:hover .close-tab { color: #cc0000; }

  #chat-windows {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .chat-window { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; background: #fff; }
  .chat-window.active { display: flex; }

  .chat-log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px;
    font-size: 11px;
    border-bottom: 1px solid #c0c0c0;
    line-height: 1.5;
  }

  .msg-them .nick { color: #cc0000; font-weight: bold; }
  .msg-me .nick   { color: #000080; font-weight: bold; }
  .msg-system     { color: #888; font-style: italic; font-size: 10px; }
  .msg-time       { color: #aaa; font-size: 9px; }

  .chat-input-area {
    display: flex; flex-direction: column; gap: 2px;
    padding: 4px;
    background: #f0f0f0;
    border-top: 1px solid #dfdfdf;
    flex-shrink: 0;
  }

  .chat-toolbar {
    display: flex; gap: 3px; font-size: 10px;
    border-bottom: 1px solid #d0d0d0;
    padding-bottom: 2px;
  }
  .chat-toolbar button {
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    padding: 1px 3px;
    font-family: "Times New Roman", serif;
  }
  .chat-toolbar button:hover { border-color: #808080; background: #c0c0c0; }

  .chat-input-row { display: flex; gap: 4px; }

  textarea.chat-input {
    flex: 1;
    border: 1px solid;
    border-color: #808080 #dfdfdf #dfdfdf #808080;
    font-family: inherit;
    font-size: 11px;
    resize: none;
    padding: 2px;
    height: 44px;
    outline: none;
  }
  textarea.chat-input:focus { border-color: #000080 #dfdfdf #dfdfdf #000080; }

  .send-col { display: flex; flex-direction: column; gap: 2px; }

  /* ── Scrollbar (retro) ── */
  ::-webkit-scrollbar { width: 16px; }
  ::-webkit-scrollbar-track { background: #c0c0c0; }
  ::-webkit-scrollbar-thumb {
    background: #c0c0c0;
    border: 1px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    box-shadow: 1px 1px 0 #fff inset;
  }

  /* ── Groupbox ── */
  .groupbox {
    border: 1px solid #808080;
    box-shadow: 1px 1px 0 #fff;
    padding: 6px;
    margin: 4px 0;
    position: relative;
    min-width: 0;
  }
  .groupbox legend { font-size: 10px; padding: 0 3px; color: #444; }

  /* ── XEP-0224 Nudge ── */
  @keyframes nudge {
    0%   { transform: translateX(0); }
    10%  { transform: translateX(-8px) rotate(-1deg); }
    20%  { transform: translateX(8px)  rotate(1deg); }
    30%  { transform: translateX(-8px) rotate(-1deg); }
    40%  { transform: translateX(8px)  rotate(1deg); }
    50%  { transform: translateX(-6px); }
    60%  { transform: translateX(6px); }
    70%  { transform: translateX(-4px); }
    80%  { transform: translateX(4px); }
    90%  { transform: translateX(-2px); }
    100% { transform: translateX(0); }
  }
  .nudging { animation: nudge 0.6s ease-in-out; }

  .nudge-btn {
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    padding: 1px 5px;
    font-size: 11px;
    font-family: inherit;
    color: #800000;
    font-weight: bold;
  }
  .nudge-btn:hover  { border-color: #808080; background: #c0c0c0; }
  .nudge-btn:active { border-color: #808080 #dfdfdf #dfdfdf #808080; }

  .msg-nudge-error {
    background: #fff0f0;
    border: 2px solid #cc0000;
    color: #cc0000;
    font-weight: bold;
    font-size: 11px;
    padding: 3px 6px;
    margin: 3px 0;
    text-align: center;
  }

  .msg-nudge {
    color: #800000;
    font-weight: bold;
    font-style: italic;
    font-size: 10px;
    text-align: center;
    padding: 2px 0;
    border-top: 1px dashed #ffaaaa;
    border-bottom: 1px dashed #ffaaaa;
    margin: 2px 0;
  }

  /* ── Priority Message ── */
  .msg-priority {
    background: #ffffcc;
    border: 2px solid #cc0000;
    padding: 4px 6px;
    margin: 4px 0;
    font-size: 11px;
  }
  .msg-priority .priority-header {
    color: #cc0000;
    font-weight: bold;
    font-size: 10px;
    margin-bottom: 3px;
    display: flex; align-items: center; gap: 6px;
  }
  .msg-priority .priority-header span { flex: 1; }
  .msg-priority .priority-body { color: #000; font-weight: bold; }
  .msg-priority .priority-ack { margin-top: 4px; display: flex; justify-content: flex-end; }

  .priority-ack-btn {
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #c0c0c0;
    padding: 1px 8px;
    font-size: 10px;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
    color: #cc0000;
  }
  .priority-ack-btn:active   { border-color: #808080 #dfdfdf #dfdfdf #808080; }
  .priority-ack-btn:disabled { color: #888; cursor: default; }

  .priority-send-btn {
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #ffeeee;
    padding: 3px 8px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    font-weight: bold;
    color: #cc0000;
  }
  .priority-send-btn:active { border-color: #808080 #dfdfdf #dfdfdf #808080; padding: 4px 7px 2px 9px; }

  /* ── Mobile back button (hidden on desktop) ── */
  .mobile-back-btn {
    display: none;
    border: 2px solid;
    border-color: #dfdfdf #808080 #808080 #dfdfdf;
    background: #c0c0c0;
    padding: 6px 10px;
    font-size: 12px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
  }
  .mobile-back-btn:active { border-color: #808080 #dfdfdf #dfdfdf #808080; }

  /* ── Mobile layout ── */
  @media (max-width: 768px) {
    body { font-size: 13px; }

    .title-bar { padding: 6px 8px; }
    .menubar { display: none; } /* decorative Win98 menu, not functional — just eats space on small screens */

    #login-card, #lock-card { width: 100%; max-width: 340px; min-width: 0; padding: 0 12px; }

    .form-row { flex-wrap: wrap; }
    .form-row label { width: auto; text-align: left; }

    input[type=text], input[type=password], textarea.chat-input {
      font-size: 16px; /* prevent iOS auto-zoom on focus */
    }

    .btn, .btn.primary { padding: 8px 14px; }

    #app-layout { position: relative; overflow: hidden; }

    #buddy-panel {
      width: 100%;
      min-width: 0;
      position: absolute;
      inset: 0;
      z-index: 2;
      border-right: none;
    }

    #chat-area {
      position: absolute;
      inset: 0;
      display: none;
    }

    #app-layout.mobile-chat-open #buddy-panel { display: none; }
    #app-layout.mobile-chat-open #chat-area { display: flex; }

    .mobile-back-btn { display: flex; align-items: center; justify-content: center; }

    #buddy-list li { padding: 10px 10px; min-height: 24px; }
    .add-buddy-row { padding: 8px; }
    .add-buddy-row input, .add-buddy-row button { font-size: 16px; padding: 8px; }

    .chat-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chat-tab { padding: 8px 12px; font-size: 13px; }

    .chat-toolbar button { padding: 6px 10px; }
    .nudge-btn, .priority-send-btn { padding: 6px 10px; font-size: 12px; }

    textarea.chat-input { height: 60px; }
    .send-col .btn { padding: 10px 14px; }
  }
</style>
</head>
<body>

<div class="window" id="main-window">

  <div class="title-bar">
    <span>&#128172; woofr.chat <span class="alpha-badge" title="This is an early alpha build and may be unstable">ALPHA</span></span>
    <div class="title-bar-buttons">
      <button class="title-btn">_</button>
      <button class="title-btn">&#9633;</button>
      <button class="title-btn" style="font-size:11px;">&#x2715;</button>
    </div>
  </div>

  <div class="menubar">
    <span><u>F</u>ile</span>
    <span><u>P</u>eople</span>
    <span><u>A</u>ctions</span>
    <span><u>H</u>elp</span>
  </div>

  <div class="app-body">

    <!-- LOGIN -->
    <div id="login-panel">
      <div id="login-card">
        <div class="login-logo">woofr<span>.chat</span> <span class="alpha-badge" title="This is an early alpha build and may be unstable">ALPHA</span></div>

        <fieldset class="groupbox">
          <legend>Sign In</legend>
          <div style="display:flex;flex-direction:column;gap:5px;margin-top:4px;">
            <div class="form-row">
              <label for="inp-jid">Screen Name:</label>
              <input type="text" id="inp-jid" placeholder="user@woofr.chat" autocomplete="username" spellcheck="false" />
            </div>
            <div class="form-row">
              <label for="inp-pass">Password:</label>
              <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" />
            </div>
            <input type="hidden" id="inp-bosh" value="https://woofr.chat:5443/bosh" />
          </div>
        </fieldset>

        <div class="login-warning" id="insecure-warning" style="display:none">
          &#9888; This page wasn't loaded over HTTPS, so sign-in is disabled.
        </div>

        <div style="display:flex;justify-content:flex-end;gap:6px;padding:0 2px;">
          <button class="btn primary" id="btn-login">Sign In</button>
          <button class="btn" id="btn-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- LOCK (after inactivity). The app layout is hidden, not removed, so the
         session picks up where it left off once unlocked. -->
    <div id="lock-panel" style="display:none">
      <div id="lock-card">
        <fieldset class="groupbox">
          <legend>Session Locked</legend>
          <div style="display:flex;flex-direction:column;gap:5px;margin-top:4px;">
            <div id="lock-msg"></div>
            <div class="form-row">
              <label>Screen Name:</label>
              <b id="lock-jid"></b>
            </div>
            <div class="form-row">
              <label for="inp-unlock-pass">Password:</label>
              <input type="password" id="inp-unlock-pass" autocomplete="current-password" />
            </div>
            <div class="lock-error" id="lock-error"></div>
          </div>
        </fieldset>

        <div style="display:flex;justify-content:flex-end;gap:6px;padding:0 2px;">
          <button class="btn primary" id="btn-unlock">Unlock</button>
          <button class="btn" id="btn-lock-sign-out">Sign Out</button>
        </div>
      </div>
    </div>

    <!-- APP LAYOUT (shown after login) -->
    <div id="app-layout" style="display:none">

      <!-- LEFT: buddy list sidebar -->
      <div id="buddy-panel">
        <div id="my-status">
          <div class="status-dot" id="my-dot"></div>
          <span id="my-jid-display">you</span>
          <span style="margin-left:auto;color:#666;">[online]</span>
        </div>

        <div class="buddy-header">
          <span>Buddy List</span>
          <span id="buddy-count">0 online</span>
        </div>

        <ul id="buddy-list">
          <li class="group-header">▼ Buddies</li>
        </ul>

        <div class="add-buddy-row">
          <input type="text" id="inp-add-buddy" placeholder="Add buddy (jid@server)" spellcheck="false" />
          <button class="btn" id="btn-add-buddy">Add</button>
        </div>

        <hr class="separator">

        <div style="display:flex;justify-content:flex-end;gap:4px;padding:4px 4px;">
          <button class="btn" id="btn-sign-out">Sign Out</button>
        </div>
      </div>

      <!-- RIGHT: chat area -->
      <div id="chat-area">
        <button class="mobile-back-btn" id="mobile-back-btn">&larr; Buddies</button>
        <div class="chat-tabs" id="chat-tabs" style="display:none"></div>
        <div id="chat-windows"></div>
        <div id="chat-placeholder">Select a buddy to start chatting</div>
      </div>

    </div><!-- /app-layout -->

  </div><!-- /app-body -->

  <!-- STATUS BAR -->
  <div id="status-bar">Not connected.</div>

</div><!-- /window -->

<script src="app.js"></script>
</body>
</html>
