server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise nginx version in error pages or headers
    server_tokens off;

    # HIPAA: no caching of any content — prevents PHI lingering in browser/proxy caches
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Pragma        "no-cache" always;
    add_header Expires       "0"        always;

    # HIPAA: enforce HTTPS at the browser level for all future requests
    # (TLS is terminated by the reverse proxy in front of this container)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options        "DENY"        always;
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff"     always;
    # No referrer header sent on navigation
    add_header Referrer-Policy        "no-referrer" always;
    # Disable browser features that have no business in a chat client
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Isolate this window from cross-origin pages that open it (or that it opens)
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content Security Policy
    # - script-src 'self' only: all JS (app.js, omemo.js, vendored Strophe and
    #   libsignal) is served from this container. No inline script, no inline
    #   on*="" handlers, no eval, no CDNs — so an injected <img onerror=...>
    #   can't run.
    # - style-src 'self' only: all CSS is in styles.css, and there are no
    #   style="" attributes, so injected markup can't restyle the page either.
    # - connect-src: the BOSH endpoint, plus this origin ('self') so the app can
    #   notice a new deploy by re-fetching its own files. No other XHR/WS allowed.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://woofr.chat:5443; img-src 'self' data: blob:; media-src blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

    # Redirects must stay relative: an absolute one would point at this
    # container's internal port instead of the public URL NPM serves.
    absolute_redirect off;

    # Canonicalise to a trailing slash so the page's relative script URLs
    # (app.js, vendor/...) resolve under /messenger/alpha/.
    location = /messenger/alpha {
        return 301 /messenger/alpha/;
    }

    location = /messenger/alpha/ {
        try_files /index.html =404;
    }

    location = /messenger/alpha/index.html {
        try_files /index.html =404;
    }

    location = /messenger/alpha/app.js {
        try_files /app.js =404;
    }

    location = /messenger/alpha/omemo.js {
        try_files /omemo.js =404;
    }

    location = /messenger/alpha/history.js {
        try_files /history.js =404;
    }

    location = /messenger/alpha/media.js {
        try_files /media.js =404;
    }

    location = /messenger/alpha/richtext.js {
        try_files /richtext.js =404;
    }

    location = /messenger/alpha/styles.css {
        try_files /styles.css =404;
    }

    location = /messenger/alpha/vendor/strophe.umd.min.js {
        try_files /vendor/strophe.umd.min.js =404;
    }

    location = /messenger/alpha/vendor/libsignal.min.js {
        try_files /vendor/libsignal.min.js =404;
    }

    # Licence texts (GPL-3.0 requires that people receiving the code can
    # read them). Linked from the About dialog.
    location = /messenger/alpha/LICENSE.txt {
        default_type text/plain;
        charset utf-8;
        try_files /LICENSE =404;
    }

    location = /messenger/alpha/vendor/libsignal-LICENSES.txt {
        charset utf-8;
        try_files /vendor/libsignal-LICENSES.txt =404;
    }

    location = /messenger/alpha/vendor/strophe.js-LICENSE.txt {
        charset utf-8;
        try_files /vendor/strophe.js-LICENSE.txt =404;
    }

    # Block everything else — no directory listing, no hidden files, no docs
    location / {
        return 404;
    }
}
