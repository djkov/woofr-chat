server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise nginx version in error pages or headers
    server_tokens off;

    # HIPAA: no caching of any content — prevents PHI lingering in browser/proxy caches
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Pragma        "no-cache" always;
    add_header Expires       "0"        always;

    # HIPAA: enforce HTTPS at the browser level for all future requests
    # (TLS is terminated by the reverse proxy in front of this container)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options        "DENY"        always;
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff"     always;
    # No referrer header sent on navigation
    add_header Referrer-Policy        "no-referrer" always;
    # Disable browser features that have no business in a chat client
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy
    # - script-src: 'unsafe-inline' required because JS is inline in index.html;
    #   move JS to an external file to tighten this to 'self' only (future hardening).
    # - connect-src: locked to the BOSH endpoint only — no other XHR/WS allowed.
    add_header Content-Security-Policy "
        default-src 'none';
        script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src   'self' 'unsafe-inline';
        connect-src https://woofr.chat:5443;
        img-src     'self' data:;
        frame-ancestors 'none';
        base-uri    'self';
        form-action 'none';
    " always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # Block everything else — no directory listing, no hidden files, no docs
    location / {
        return 404;
    }
}
