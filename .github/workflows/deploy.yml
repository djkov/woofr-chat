name: Build & Stage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: echo "image_tag=${GITHUB_REF_NAME}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker compose build

  deploy-staging:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start staging stack on an alternate port
        run: |
          docker compose -p woofr-staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build

      - name: Smoke test staging
        run: |
          base=http://127.0.0.1:8091/messenger/alpha
          for i in {1..10}; do
            curl -sf -o /dev/null "$base/" && break
            sleep 2
          done
          # Check the scripts and stylesheet too: with one missing, the page
          # still serves but the app is dead.
          for path in / /app.js /omemo.js /history.js /styles.css /vendor/strophe.umd.min.js /vendor/libsignal.min.js; do
            curl -sf -o /dev/null "$base$path" || { echo "Staging smoke test failed: $path" >&2; exit 1; }
          done

      - name: Tear down staging stack
        if: always()
        run: docker compose -p woofr-staging -f docker-compose.yml -f docker-compose.staging.yml down

  # Production is a *separate* workflow (deploy-production.yml) that only
  # runs via manual workflow_dispatch. GitHub's environment "required
  # reviewers" protection isn't available on private personal-account repos,
  # so the manual trigger itself is the approval gate: nothing reaches
  # production automatically, no matter what happens here.
