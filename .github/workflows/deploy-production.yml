name: Deploy Production

# Manual only: nothing reaches production without someone deliberately
# triggering this workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy, e.g. main or v1.0.0"
        required: true
        default: "main"
        type: string

jobs:
  deploy-production:
    runs-on: self-hosted
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Deploy
        run: docker compose up -d --build

      - name: Verify production health
        run: |
          base=http://127.0.0.1:8090/messenger/alpha
          for i in {1..10}; do
            curl -sf -o /dev/null "$base/" && break
            sleep 2
          done
          # Check the scripts too: with one missing, the page still serves
          # but the app is dead.
          for path in / /app.js /vendor/strophe.umd.min.js; do
            curl -sf -o /dev/null "$base$path" || { echo "Production health check failed: $path" >&2; exit 1; }
          done
